spring:
  application:
    name: fashiona-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fashiona_db
    username: ${DB_USERNAME:fashiona_user}
    password: ${DB_PASSWORD:fashiona_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none              # Flyway manages all schema migrations
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@fashiona.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: simple

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:fashiona-super-secret-jwt-key-2024-change-in-production}
  expiration: 86400000       # 24 hours in ms
  refresh-expiration: 604800000  # 7 days

# Cloudinary (image storage)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Stripe (payments)
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Razorpay (Indian payment gateway)
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

# Pagination defaults
app:
  pagination:
    default-page-size: 20
    max-page-size: 100
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  upload:
    max-file-size: 5MB
    allowed-types: image/jpeg,image/png,image/webp

logging:
  level:
    com.fashion: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
