version: '3.8'

# ── LOCAL DEVELOPMENT ─────────────────────────────────────────
# Runs a local PostgreSQL container alongside backend + frontend.
# Use docker-compose.prod.yml for AWS (points to Aurora instead).

services:
  db:
    image: postgres:15-alpine
    container_name: fashiona-db
    environment:
      POSTGRES_DB: fashiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/V1__init_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/V2__seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fashiona-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fashiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-at-least-64-chars-long-change-for-production}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: fashiona-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
